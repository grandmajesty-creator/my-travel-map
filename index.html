<!DOCTYPE html>
<html lang="zh-TW" class="h-full w-full">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>2027年林家旅遊行程簡報 | Interactive Travel Map</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Leaflet CSS & JS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>

  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Noto+Sans+TC:wght@300;400;500;700&display=swap" rel="stylesheet">

  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'Noto Sans TC', 'sans-serif'],
          },
          colors: {
            brand: {
              50: '#f0f9ff',
              100: '#e0f2fe',
              500: '#0ea5e9',
              600: '#0284c7',
              700: '#0369a1',
              900: '#0c4a6e',
            }
          }
        }
      }
    }
  </script>

  <style>
    /* Ensure explicit height for html, body, and Leaflet map container */
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
    }
    #map-wrapper {
      position: absolute;
      top: 0;
      bottom: 0;
      left: 0;
      right: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
      background-color: #e2e8f0;
    }
    #map {
      width: 100%;
      height: 100%;
      min-height: 100%;
      background: #f8fafc;
    }

    /* Leaflet Marker Styling */
    .marker-pin {
      width: 36px;
      height: 36px;
      border-radius: 50% 50% 50% 0;
      background: #0284c7;
      position: absolute;
      transform: rotate(-45deg);
      left: 50%;
      top: 50%;
      margin: -18px 0 0 -18px;
      box-shadow: 0 4px 12px rgba(2, 132, 199, 0.4);
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.25s ease-out;
      cursor: pointer;
    }
    .marker-pin::after {
      content: '';
      width: 24px;
      height: 24px;
      margin: 6px 0 0 6px;
      background: #fff;
      position: absolute;
      border-radius: 50%;
    }
    .marker-pin-inner {
      transform: rotate(45deg);
      z-index: 10;
      color: #0284c7;
      font-weight: 800;
      font-size: 13px;
    }
    .marker-pin.active {
      background: #f43f5e;
      transform: rotate(-45deg) scale(1.25);
      box-shadow: 0 6px 16px rgba(244, 63, 94, 0.5);
    }
    .marker-pin.active .marker-pin-inner {
      color: #f43f5e;
    }

    /* Scrollbars */
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: #f1f5f9; }
    ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
  </style>
</head>
<body class="bg-slate-900 font-sans text-slate-800 antialiased overflow-hidden w-screen h-screen">

  <div class="relative w-full h-full flex flex-col md:flex-row overflow-hidden">

    <!-- MAP CONTAINER -->
    <div id="map-wrapper">
      <div id="map"></div>
      
      <!-- Fallback Canvas / SVG Map (Active if offline or tile fails) -->
      <div id="canvas-map-container" class="hidden absolute inset-0 bg-sky-50 flex items-center justify-center">
        <svg id="canvas-svg" class="w-full h-full absolute inset-0"></svg>
        <div id="canvas-markers-layer" class="absolute inset-0 pointer-events-none"></div>
      </div>
    </div>

    <!-- TOP HEADER CONTROL BAR -->
    <header class="absolute top-4 left-4 right-4 md:right-auto z-20 flex items-center justify-between gap-3 bg-white/95 backdrop-blur-md px-4 py-3 rounded-2xl shadow-xl border border-white/60 max-w-xl">
      <div class="flex items-center gap-3">
        <div class="p-2.5 bg-brand-600 text-white rounded-xl shadow-md shrink-0">
          <i data-lucide="map-pin" class="w-5 h-5"></i>
        </div>
        <div class="min-w-0">
          <h1 class="font-bold text-slate-800 text-base md:text-lg leading-tight truncate">廈門2027寒假之旅 9 日遊</h1>
          <p class="text-xs text-slate-500 truncate">點擊景點檢視照片、影片與行程介紹</p>
        </div>
      </div>
      
      <div class="flex items-center gap-2 shrink-0">
        <!-- Presentation Mode Button -->
        <button id="btn-presentation" onclick="startPresentation()" class="flex items-center gap-1.5 px-3.5 py-2 bg-gradient-to-r from-brand-500 to-brand-600 hover:from-brand-600 hover:to-brand-700 text-white text-xs md:text-sm font-semibold rounded-xl shadow-md transition-all active:scale-95">
          <i data-lucide="play" class="w-4 h-4 fill-current"></i>
          <span>▶ 簡報模式</span>
        </button>

        <!-- Toggle Sidebar Button -->
        <button onclick="toggleDrawer()" class="p-2 text-slate-600 hover:text-brand-600 hover:bg-slate-100 rounded-xl transition-all" title="行程管理">
          <i data-lucide="list" class="w-5 h-5"></i>
        </button>
      </div>
    </header>

    <!-- MAP CONTROL & PROVIDER SELECTOR (BOTTOM LEFT) -->
    <div class="absolute bottom-6 left-6 z-20 flex flex-wrap items-center gap-2">
      <button onclick="fitMapBounds()" class="p-2.5 bg-white/90 backdrop-blur-md text-slate-700 hover:bg-white rounded-2xl shadow-lg border border-white/50 transition-all active:scale-95 flex items-center gap-2 text-xs font-semibold">
        <i data-lucide="maximize" class="w-4 h-4"></i>
        <span class="hidden md:inline">視角全覽</span>
      </button>

      <div class="relative bg-white/90 backdrop-blur-md rounded-2xl shadow-lg border border-white/50 px-2 py-1 flex items-center gap-1">
        <i data-lucide="layers" class="w-4 h-4 text-slate-500 ml-1"></i>
        <select id="tile-provider-select" onchange="changeTileProvider(this.value)" class="bg-transparent text-xs font-medium text-slate-700 py-1.5 pr-2 focus:outline-none cursor-pointer">
          <option value="osm">OpenStreetMap 地圖</option>
          <option value="carto-light">CartoDB 簡約白</option>
          <option value="canvas">離線 SVG 向量模式</option>
        </select>
      </div>
    </div>

    <!-- RIGHT SIDEBAR (DRAWER) -->
    <aside id="sidebar" class="absolute top-0 right-0 h-full w-full md:w-[420px] bg-white/95 backdrop-blur-xl shadow-2xl z-30 transform translate-x-full transition-transform duration-300 ease-in-out flex flex-col">
      
      <!-- Drawer Header -->
      <div class="p-5 border-b border-slate-100 flex items-center justify-between bg-slate-50/50">
        <div class="flex items-center gap-2">
          <i data-lucide="compass" class="w-5 h-5 text-brand-600"></i>
          <h2 class="font-bold text-slate-800 text-lg">行程景點清單</h2>
          <span id="spot-count" class="px-2 py-0.5 text-xs font-semibold bg-brand-100 text-brand-700 rounded-full">0</span>
        </div>
        <button onclick="toggleDrawer()" class="p-1.5 text-slate-400 hover:text-slate-600 hover:bg-slate-200/50 rounded-lg transition-all">
          <i data-lucide="x" class="w-5 h-5"></i>
        </button>
      </div>

      <!-- Tabs -->
      <div class="flex border-b border-slate-100 px-5 gap-4 text-sm font-medium text-slate-500">
        <button id="tab-list-btn" onclick="switchTab('list')" class="py-3 border-b-2 border-brand-500 text-brand-600 font-semibold flex items-center gap-1.5">
          <i data-lucide="map" class="w-4 h-4"></i> 景點路線
        </button>
        <button id="tab-add-btn" onclick="switchTab('add')" class="py-3 border-b-2 border-transparent hover:text-slate-700 flex items-center gap-1.5">
          <i data-lucide="plus-circle" class="w-4 h-4"></i> 新增/編輯景點
        </button>
      </div>

      <!-- Tab 1: Spot List -->
      <div id="tab-list" class="flex-1 overflow-y-auto p-5 space-y-3">
        <div id="spots-container" class="space-y-3"></div>
      </div>

      <!-- Tab 2: Form -->
      <div id="tab-add" class="flex-1 overflow-y-auto p-5 hidden space-y-4">
        <form id="spot-form" onsubmit="handleSaveSpot(event)" class="space-y-4">
          <input type="hidden" id="form-spot-id">
<div style="margin-bottom: 12px;">
  <label style="font-weight: bold; display: block; margin-bottom: 4px;">播放順序 / 天數</label>
  <input type="number" id="form-order" min="1" placeholder="請輸入順序數字 (如 1, 2, 3)" style="width: 100%; padding: 6px;">
</div>
          <div>
            <label class="block text-xs font-semibold text-slate-600 mb-1">景點名稱 *</label>
            <input type="text" id="form-name" required placeholder="例如: 太魯閣國家公園" class="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-brand-500">
          </div>

          <div class="grid grid-cols-2 gap-2">
            <div>
              <label class="block text-xs font-semibold text-slate-600 mb-1">緯度 (Lat) *</label>
              <input type="number" step="any" id="form-lat" required placeholder="24.1583" class="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-brand-500">
            </div>
            <div>
              <label class="block text-xs font-semibold text-slate-600 mb-1">經度 (Lng) *</label>
              <input type="number" step="any" id="form-lng" required placeholder="121.6213" class="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-brand-500">
            </div>
          </div>
          <p class="text-[11px] text-brand-600 flex items-center gap-1">
            <i data-lucide="info" class="w-3.5 h-3.5"></i> 點擊地圖任何位置即可自動抓取經緯度
          </p>

          <div>
            <label class="block text-xs font-semibold text-slate-600 mb-1">照片網址 (Image URL)</label>
            <input type="url" id="form-image" placeholder="https://images.unsplash.com/..." class="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-brand-500">
          </div>

          <div>

          </div>

          <div>
            <label class="block text-xs font-semibold text-slate-600 mb-1">景點介紹與特色</label>

          </div>

          <div class="flex gap-2 pt-2">

              清空
            </button>
          </div>
        </form>
      </div>

      <div class="p-4 border-t border-slate-100 bg-slate-50/50 flex justify-between items-center text-xs text-slate-500">

    </aside>

        <button onclick="closeModal()" class="absolute top-4 right-4 z-20 bg-black/40 hover:bg-black/60 text-white p-2 rounded-full backdrop-blur-sm transition-all shadow-lg">

              <i data-lucide="image" class="w-3.5 h-3.5"></i> 照片

            </button>
          </div>

          <div id="modal-badge" class="absolute top-4 left-4 bg-brand-600/90 backdrop-blur-md text-white px-3 py-1 rounded-full text-xs font-bold shadow-lg">
            SPOT 01

        </div>

        <!-- Detail Content -->
        <div class="p-6 overflow-y-auto flex-1 space-y-3">
          <div>
            <h2 id="modal-title" class="text-2xl font-bold text-slate-900">景點名稱</h2>
            <p class="text-xs text-slate-400 font-mono mt-1 flex items-center gap-1">
              <i data-lucide="map-pin" class="w-3.5 h-3.5 text-brand-500"></i> <span id="modal-latlng">0.0, 0.0</span>
            </p>
          </div>
          <div class="border-t border-slate-100 pt-3">
            <p id="modal-desc" class="text-slate-600 text-sm leading-relaxed whitespace-pre-line"></p>
          </div>
        </div>

        <!-- Footer Controls -->
        <div class="p-4 bg-slate-50 border-t border-slate-100 flex items-center justify-between">
          <button id="btn-prev-spot" onclick="navigateSpot(-1)" class="px-4 py-2 bg-white hover:bg-slate-100 border border-slate-200 text-slate-700 text-xs font-semibold rounded-xl flex items-center gap-1 shadow-sm">
            <i data-lucide="chevron-left" class="w-4 h-4"></i> 上一個景點
          </button>
          
          <span id="modal-pagination" class="text-xs font-semibold text-slate-500">1 / 5</span>

          <button id="btn-next-spot" onclick="navigateSpot(1)" class="px-4 py-2 bg-brand-600 hover:bg-brand-700 text-white text-xs font-semibold rounded-xl flex items-center gap-1 shadow-md">
            下一個景點 <i data-lucide="chevron-right" class="w-4 h-4"></i>
          </button>
        </div>

      </div>
    </div>

  </div>

    "desc": "金廈小三通航線乘船資訊整理如下：\n### 一、 航線與航程概況\n* **對開地點**：金門水頭碼頭 $\\leftrightarrow$ 廈門五通碼頭\n* **航行時間**：約 **30 分鐘**\n* **營運頻率**：雙向對開，每日約 24 班次（單向約 12 班次），班距約 30～60 分鐘一班。\n* **營業時間**：\n* **首班船**：約 08:30\n* **末班船**：約 17:30\n### 二、 票價參考與購票管道\n#### 1. 票價參考（單程）\n* **成人全票**：約 NT$ 700 ～ 900 / RMB 137 元\n* **設籍金門居民（金門戶籍票）**：約 RMB 105 元\n* **敬老 / 兒童 / 博愛票**：約 NT$ 350 ～ 450 / RMB 68 元（適用於 65 歲以上長者、身心障礙者或 3～11 歲兒童）\n* **嬰兒票**：約 NT$ 100 ～ 150 / RMB 13 元（未滿 3 歲，不佔位）\n#### 2. 購票管道\n* **線上預訂（推薦）**：可透過旅遊平台（如 易遊網、可樂旅遊、Trip.com）、各大旅行社或船公司線上訂票系統預訂。\n* **現場購票**：可至金門水頭碼頭或廈門五通碼頭售票櫃檯買票（連續假期或旺季建議提早預訂，以免無座位）。\n### 三、 搭船必備證件\n出入境兩端查驗不同，**兩大證件務必隨身攜帶**：\n1. **中華民國護照（正本）**：金門水頭碼頭出境時查驗（效期須在 6 個月以上）。\n2. **台胞證（正本）**：進入廈門五通碼頭入境時查驗。\n* 若無台胞證，可於廈門五通碼頭現場辦理**落地簽（單次入境許可）**，需預留現場排隊與填單時間。\n3. **國民身分證**：搭乘台灣本島往返金門的國內線飛機時備查。\n### 四、 乘船流程與時間建議\n1. **提前抵達**：建議**至少提前 60～70 分鐘**抵達碼頭辦理報到、領票與出境查驗。\n2. **報到截止**：已訂票者，開航前 **35 分鐘** 截止辦理報到與取票。\n3. **交通銜接（金門端）**：\n* **金門尚義機場 $\\leftrightarrow$ 水頭碼頭**：搭乘計程車約 15～20 分鐘；搭乘公車或接駁巴士約 30 分鐘。\n* 若購買「機+船」聯運或套票，通常包含機場至碼頭的接駁服務。\n### 五、 行李攜帶規定\n* **免費額度**：一般成人每人約可免費攜帶 **30 公斤** 行李（手提加上託運）。\n* **限制與安全**：禁止攜帶易燃易爆物、危險品或違禁品；貴重物品（護照、台胞證、現金、電子產品）請務必隨身攜帶，勿放入託運行李。",

    "desc": "福建非常火爆的「朱富貴海鮮火鍋」。這家餐廳以超高性價比、食材豐富的超長冷藏取菜檯聞名，是許多人到廈門旅遊時實現「海鮮自由」的必吃排隊名店。\n以下為您整理這家超人氣火鍋店的亮點與用餐攻略：\n🌟 店家三大核心特色\n• 平價計盤、一人一鍋： 餐廳採用個人小火鍋的形式，提供超過 12 種湯底供選擇。食材並非吃到飽，而是擺在長長的冰檯上看盤子顏色計價，最貴的一盤折合台幣也只要幾十元，非常親民。\n• 海鮮與食材天堂： 主打鮮活生猛海鮮，包含螃蟹（秋季有飽滿蟹膏）、鮑魚、蛤蜊、海螺貝類、生蠔等，還有現切牛肉、各式火鍋料與新鮮蔬菜，種類多到讓人容易產生選擇困難。\n• 超長營業時間： 大部分分店從下午一路營業到凌晨兩點至四點，因此也是廈門當地非常受歡迎的深夜宵夜首選。\n📍 廈門熱門分店資訊\n朱富貴在廈門有多家分店，您可以選擇距離您行程较近的地點：\n分店名稱\t特色與交通建議\n火車站禹悅匯店\t交通最便利。位於禹悅匯 A 館 5 樓，出地鐵 3 號線「廈門火車站」步行即可到達。這家店人氣極高，平日正餐或深夜宵夜時段經常需要排隊取號。\n七星樂都匯店（思明歡樂頌）\t大眾點評必吃榜常客，在思明區海鮮火鍋口味榜中名列前茅，適合重視口味評價的饕客。\n銀泰百貨店 (B1)\t場地寬敞、座位多，相對其他熱門鬧區分店，排隊等待時間通常較短，如果不想耗時排隊可以考慮這裡。\n中山路店\t鄰近廈門著名的中山路步行街商圈，適合將逛街與用餐行程排在一起的遊客。\n💡 內行用餐小貼士\n1. 避開高峰或提早取號： 身為大眾點評必吃榜的排隊名店，平假日用餐尖峰時間人都非常多。建議提早利用手機線上取號，或是選擇離峰、宵夜時段前往。\n2. 專攻海鮮與現切牛肉： 這裡的海鮮新鮮度高、補貨速度快，直接專攻高單價的海鮮與現切牛肉最划算。\n3. 大推手工麵： 許多網友推薦最後一定要拿一盤他們家的「手工麵」下鍋，吸飽海鮮湯頭精華非常過癮（但極具飽足感，請留點胃）。",

    "desc": "鼓浪嶼是位於中國福建省廈門市西南方的一座絕美海島，並於 2017 年正式被列入「世界文化遺產」名錄。 島上因西南方有海蝕洞受浪潮衝擊，聲如擂鼓而得名。這裡最著名的就是清末民初各國在此設立領事館留下的豐富萬國建築，因此被譽為「海上花園」、「琴島」與「萬國建築博物館」。\n 2026 年最新、最完整的登島與遊玩指南：\n🚢 交通登島指南（遊客必看）\n前往鼓浪嶼唯一的交通方式是搭乘渡輪，航程約 15-20 分鐘。不過，遊客與廈門本地居民的碼頭是分開的，千萬別跑錯了！\n• 白天去程（07:10 - 17:30）：\n\t• 出發碼頭： 郵輪中心廈鼓碼頭（東渡碼頭）。\n\t• 抵達碼頭： 三丘田碼頭（近最美轉角、主要景點）或 內厝澳碼頭（較安靜，適合走秘境路線）。\n• 夜間去程與回程： 傍晚 17:30 後，遊客需改至「廈門輪渡碼頭 2 號廳」搭乘夜航船。\n• 船票與預約：\n\t• 票價為 ¥35 人民幣（普通船往返） 或 ¥80 人民幣（豪華/精品船往返）。\n\t• 強烈建議提早 3-5 天預約！ 可使用微信/支付寶搜尋「嶼見廈門」小程序，或透過 Trip.com 鼓浪嶼船票 等平台購票。\n\t• 重要提醒： 登島實名制，台灣遊客必須攜帶台胞證，並建議提早 1 小時到人工窗口換取紙本票券。\n🗺️ 經典必遊景點\n島上景點可以單獨買票，但如果你打算深度遊玩，推薦購買 ¥100 人民幣的景點聯票，CP 值最高。\n景點名稱\t亮點特色\t建議停留時間\n日光岩\t全島最高點，可鳥瞰整座島嶼與對岸廈門市區的無敵海景（全票 ¥50）。\t1 - 1.5 小時\n菽莊花園\t依海而建的江南風古典園林，裡面附設極具特色的「鋼琴博物館」。\t1 小時\n皓月園\t擁有雄偉的鄭成功巨型石雕像，是欣賞海景與日落的絕佳位置。\t40 分鐘\n八卦樓 (風琴博物館)\t中西合璧的紅頂經典建築，收藏了來自全球的巨型珍貴管風琴。\t1 小時\n最美轉角\t網美爭相排隊打卡的地標，兩條紅磚洋房小巷交會的轉角，拍照極度出片。\t10 分鐘\n🚶 一日遊推薦路線\n鼓浪嶼全島面積不大，但因為全程只能靠雙腳步行（繞一圈約需 4-5 小時），若體力有限，下船後可在碼頭左側購買 ¥50 的觀光小白車（電瓶車） 代步。\n• 經典網美與歷史線：\n三丘田碼頭登島 ➡️ 最美轉角 ➡️ 萬國建築博覽（海天堂構、船屋） ➡️ 日光岩（登頂俯瞰） ➡️ 菽莊花園 ➡️ 龍頭路小吃街（補給美食） ➡️ 三丘田碼頭搭船回程。\n蚵仔煎與小吃：龍頭路美食推薦 😋\n島上最熱鬧的商圈集中在龍頭路，這裡匯集了無數廈門與閩南特色小吃：\n• 海蠣煎（蚵仔煎）： 肥美新鮮的土海蠣配上蛋液與地瓜粉，煎得香酥，是必吃原汁原味。\n• 龍頭魚丸店 / 原巷口魚丸鋪： Q 彈爆汁的包心魚丸湯，湯頭十分鮮美。\n• 葉氏麻糬： 傳統手工現做，裹滿花生與芝麻粉，香甜不膩口。\n• 伴手禮推薦： 可以去「趙小姐的店」或「金蘭餅店」購買傳統的綠豆餡餅與椰子餅，單顆包裝很適合帶回國。",

    "desc": "廈門八市（正式名稱為「第八市場」）是老廈門最大、最熱鬧的傳統海鮮市場，也是體驗在地閩南市井「煙火氣」的必訪聖地。 這裡自上世紀20年代起便是一座百年菜籃子，由開禾市場與營平市場組成。白天是當地居民挑選生猛活海鮮的日常菜市場，傍晚後則搖身一變成為觀光客湧入的網紅海鮮加工與古早味小吃街。\n在地美食地圖：\n💡 避坑與實用遊玩指南\n1. 出沒時間： 市場全天都有攤位，但各店營業時間不同。想看在地阿公阿嬤買菜、攤販吆喝的市井氛圍，建議早上 08:00 - 11:00 前往；如果目的是掃街吃小吃、吃海鮮晚餐，則推薦傍晚 16:30 之後前往。\n2. 海鮮加工防坑指南：\n\t• 八市滿街都是現撈活海鮮與代客料理店。購買海鮮時，務必先確認種類、計價單位（斤還是兩）、烹調方式及加工費。\n\t• 結帳前請店家確認總額。特別注意防範「塑膠袋內灌水增重」或「死蟹調換活蟹」的套路，購買後可直接拿到市場設立的「公平秤」進行實測。\n3. 行程串聯： 八市距離知名的中山路步行街走路只需要約 10 分鐘，非常適合排在同一個市區一日遊行程中。\n必吃古早味美食清單\n• 阿杰五香（開禾路111號）：八市最紅的排隊攤位之一！現炸的閩南傳統五香卷外皮酥脆、內餡肉質扎實，蘸上甜辣醬非常過癮。\n• 朱記手撕雞：撕得很細的雞肉拌入香油、麻辣醬汁與蔬菜，口感酸辣開胃，是絕佳的涼拌小吃。\n• 鍾麗君滿煎糕（開元路129號）：閩南傳統的古早味甜點，外皮Q彈微糯，內餡鋪滿香濃的花生與芝麻碎，一定要趁熱吃。\n• 惠源麵包店：承載無數廈門人童年放學記憶的老字號，招牌「炸麵包」與五指麵包便宜又紮實。\n• 橫竹路小籠包：隱藏在騎樓底下的無招牌老攤位，主打湯汁鮮美的湯包配上一碗熱騰騰的豬心湯。",

    "image": "https://image.kkday.com/v2/image/get/c_fit%2Cq_55%2Ct_webp%2Cw_960/s1.kkday.com/product_scm_26443/20260708014924_LfRLo/png",
    "video": "",
    "desc": "廈門山海健康步道是廈門島內極具指標性的「無障礙高架慢行系統」，以全線無階梯、坡度平緩、高空穿梭於林梢為最大特色，坐椅、電梯與驛站設施極為完善，非常適合長者、推車及全家大小輕鬆步行。\n這套庞大的高空綠道系統主要由兩大主線構成：貫穿東西的「雲海線」與縱貫南北的「林海線」。\n🗺️ 廈門山海健康步道核心雙線地圖\n🗺️ 兩大主線精華攻略與經典打卡點\n☁️ 雲海線（東西走向・全長約 23 公里）\n• 路徑起訖： 西起 郵輪碼頭（東渡郵輪廣場） ➔ 東至 觀音山夢幻沙灘。\n• 沿途景觀： 串聯起廈門島內的「八山三水」，包含 狐尾山公園、仙岳公園 與筼筜湖等。\n• 精華打卡點：\n\t• 和熙樓： 位於東渡客運碼頭對面，超壯觀的網紅巨型「迴旋大螺旋梯」，配有免費觀光升降電梯直達步道頂層。\n\t• 海上明珠塔： 位在狐尾山氣象公園頂端，能 360 度俯瞰廈門城市風光、海滄大橋與西海域。\n\t• 和美橋： 連接狐尾山與仙岳山的高空特色單臂懸索橋，圓弧 V 型索塔造型非常搶眼。\n🌲 林海線（南北走向・全長約 31 公里）\n• 路徑起訖： 北起 五緣灣 ➔ 南至 環島路 天泉步道廣場（近曾厝垵海邊）。\n• 沿途景觀： 穿梭於東坪山脈的山林秘境之間，主打「一邊看山、一邊看海」的頂級山海景觀。\n• 精華打卡點（網評最美、最推薦路段）：\n\t• 萬石滄海（螺旋橋）： 依山壁而建的巨大圓形鋼結構螺旋大轉盤，站在上面可以居高臨下俯瞰上李水庫與綠意盎然的峽谷城景。\n\t• 盼歸塔： 造型優美、向海面大幅度懸挑的懸空觀景平台，視野毫無遮蔽，在這裡可以遠眺大膽島（二膽島）以及廈門地標雙子星大樓，是觀賞落日與夜景的絕佳景點。\n💡 戶外達人極簡「不廢腿」散步路線推薦\n由於整條步道非常長，一般遊客不可能一天走完。若您只想花 1~2 小時輕鬆拍照、看夕陽，最推薦以下兩條精華懶人路線：\n• 路線 A（經典城市夜景）： 從地鐵 2 號線「郵輪中心站」出發 ➔ 步行至和熙樓大螺旋（可搭電梯） ➔ 漫步狐尾山段空中棧道 ➔ 打卡海上明珠塔與和美橋 ➔ 從和美園下山。 （步行約 1~1.5 小時，極適合傍晚看華燈初上）。\n• 路線 B（絕美山海日落）： 直接搭車至「上李水庫公園」或林海線 D18/D19 出入口附近 ➔ 參觀萬石滄海螺旋橋 ➔ 往南平緩步行 ➔ 經盼歸塔看海景與日落 ➔ 順風下坡至天泉步道廣場（曾厝垵海邊）。 （步行約 5 公里，大約 1.5 小時，沿途皆為緩下坡，拍照極美）。\n實用提醒： 步道全面免費，開放時間為每日 06:00 - 22:00，夜間步道兩側會有隱藏式景觀燈光，走夜路也十分安全安全、浪漫。",

    "desc": "廈門中山路步行街是廈門最老牌、最繁華的商業街區，也是全國唯一一條直通大海的商業步行街。這裡最具特色的就是整條街保存完整的南洋風情閩台騎樓建築，不論是白天欣賞復古的白色建築線條，還是夜晚來看華燈初上的璀璨夜景，都是初訪廈門必排的經典行程。\n身為當地的旅遊核心，來到中山路有幾個在地人才知道的聰明玩法與避坑指南：\n🧱 內行人的漫步路線\n• 不要只逛主街： 中山路主街寬敞，但兩側的「局口街」、「鎮邦路」、「大中路」等小巷弄，才藏著真正老廈門的煙火氣與平價在地小吃。\n• 一路走向大海： 順著中山路往西走到底就是鷺江道，對面就是知名的鼓浪嶼。建議傍晚時段前往，逛完街剛好可以到海邊吹海風、看夜景。\n🥢 舌尖上的老廈門（必吃清單）\n1. 黃則和花生湯： 百年老字號，花生仁熬煮到入口即化，湯頭偏甜，加顆雞蛋是老廈門的標配吃法。\n2. 沙茶麵： 推薦去尋覓巷弄內的「烏糖沙茶麵」或「月華沙茶麵」，濃郁的帶甜辣沙茶湯頭配上大腸、鮮蝦，非常過癮。\n3. 阿卿春卷： 在局口街入口附近，皮薄餡多，裡面包了高麗菜、豆干及獨特的貢糖末與海苔吸乾水分，口感層次豐富。\n4. 土筍凍： 廈門特色特產（由一種海生蠕蟲熬製出的膠質凍），口感清脆，搭配芥末、蒜蓉和醋，敢挑戰的人一定要試試！\n💡 實用旅遊貼士\n• 交通方式： 搭乘廈門地鐵1號線至「中山路地鐵站」或「鎮邦路站」出站即達。地鐵1號線也就是知名的「海景地鐵」，跨海路段非常漂亮。\n• 避坑指南： 步行街上常有許多拉客坐電瓶車、推銷便宜鼓浪嶼船票或一條龍旅遊行程的人，請直接拒絕，避免受騙；此外，主街上的海鮮大排檔價格通常較高，建議多看評論或往居民區找店。",

    "desc": "廈門途易藍羅約海景溫泉飯店（又稱羅約海濱溫泉酒店）是一間位於廈門集美區的 4 星級度假飯店，主打療癒的天然海水溫泉與開闊的海景客房。飯店坐落於杏濱路，鄰近熱門的集美學村景點，很適合想要遠離市區喧囂、享受泡湯放鬆的度假旅客。\n💡 飯店入住核心亮點與在地內行指南\n• 天然海水溫泉： 飯店最大的亮點是擁有源自地底的優質海水溫泉。通常入住客房都會附贈溫泉門票，戶外溫泉公園環境造景優美，一邊泡湯一邊看著海景非常愜意。\n• 無敵海景房體驗： 強烈建議預訂「高級海景房」以上房型。房間寬敞，且大多配置大浴缸與大片落地窗，拉開窗簾就能將滿眼藍海盡收眼底。\n• 豐富的豐盛早餐： 許多住客特別讚賞飯店翌日提供的自助早餐，品項極其豐盛，能體驗到不少在地與國際化結合的美味。\n• 交通與地理位置拿捏： 飯店位置距離廈門島內的核心景點（如中山路、鼓浪嶼碼頭）較遠，偏向獨立的溫泉度假村。\n下方為您即時比價各大訂房平台的即時參考價格：\n價格：10月30日週五至31日週六 · 2 大兩小房客 · 每晚 (含相關費用，不含稅金)\n\tTrip.com$2,243\n\tezTravel易遊網$2,243\n羅約海濱溫泉酒店\n中國福建省厦门市集美区杏滨路399号 邮政编码: 361022",

    "desc": "廈門靈玲國際馬戲城是全球首家以馬戲為主題的超大型旅遊綜合體，坐落於福建省廈門市集美區。這裡最核心的亮點是金獎馬戲大劇院的國際馬戲表演與野生動物王國（內有大熊貓與白老虎等珍稀動物），非常適合親子家庭與熱愛雜技表演的旅客一同造訪。\n💡 核心遊玩亮點與在地指南\n• 國際頂級馬戲盛宴：馬戲大劇院是園區的靈魂，匯聚了來自全球數十個國家的頂尖馬戲菁英。表演包含高空特技、驚險魔術、小丑互動與熱烈的大巡遊，舞台聲光電效果非常震撼。\n• 零距離動物互動：野生動物王國採用神態各異的開放式展區。你除了能探訪超人氣的大熊貓和珍稀的白老虎外，還能親手餵食長頸鹿、羊駝和小袋鼠，非常受小朋友歡迎。\n• 行前實用建議：\n\t• 演出時間：每日馬戲大秀的場次與時間可能會根據淡旺季調整（通常下午或傍晚有一場主秀）。建議一入園先確認當天的「節目時間表」，並提早 30–45 分鐘進場以搶佔中間區域的最佳觀賞視角。\n\t• 一站式度假：若想玩得更輕鬆，園區旁即是依馬戲主題打造的廈門靈玲大酒店，許多旅客會選擇入住，直接購買「酒店+門票」的套票最為划算。",

    "desc": "廈門國際園林博覽苑（簡稱園博苑）位於中國福建省廈門市集美區杏林灣畔，是第六屆中國國際園林花卉博覽會的舉辦地。它總面積達 6.76 平方公里（含大面積水域），被譽為「世界上獨一無二的水上大觀園」。園區由 5 個展園島、4 個生態景觀島和 2 個半島組成，以眾星拱月的姿態展現「園在水上，水在園中」的絕美景致。\n自 2021 年起，園博苑已全面取消大門票，向公眾免費開放，非常適合安排大半天至一天的慢步調行程。\n🗺️ 精選遊玩路線與核心景點\n園區幅員遼闊，若想高效遊覽，建議由地鐵站直達的西一門或主展島的南門入園：\n• 江南園與嶺南園： 匯聚了濃郁的古典中式美學，江南水榭、亭台石橋與白牆黛瓦相映成趣，是漢服與古風攝影的絕佳機位。\n• 閩台園（嘉園）： 核心地標之一，深度展現閩南紅磚厝的營造法式與海峽兩岸的園林同源文化。\n• 月光環（地標建築）： 矗立於水面上的巨大圓環建築。每到傍晚亮燈時，月光環與水面倒影相得益彰，甚至能組合成完美的「18」字樣或其他奇幻夜景。\n• 海洋島（時花展區）： 四季皆有不同的繽紛花海（如馬鞭草、鬱金香等），彩色風車與花藝裝置環繞，出片率極高。\n🚌 園內交通與遊覽建議\n由於「園區大到一天逛不完」，強烈建議搭乘園內的景區遊覽車：\n1. 觀光小火車（環線）： 票價約 30 元人民幣，適合想要輕鬆環繞長線、全面瀏覽大方向的旅客。\n2. 電瓶車： 分為單程（約 5 元）與環線（約 30 元），步行累了可以隨時補票代步，老年人通常享有半價優惠。\n3. 單車租借： 園區亦有雙人或多人自行車租借，能一邊騎行一邊享受海濱微風。\nℹ️ 實用旅遊小貼士\n• 開放時間：\n\t• 夏令時（4月至10月）： 07:00 - 19:00\n    • 冬令時（11月至次年3月）： 07:00 - 18:00\n\t• 註：若遇特殊活動或燈會檔期，夜間亮燈可能延長開放至 22:00（如特展期間西一門主燈區）。\n• 門票預約： 雖然免費，但建議提前在微信公眾號（如「廈門旅遊集散服務中心」）進行線上實名預約。\n• 如何前往： 最推薦搭乘廈門地鐵 1 號線直達「園博苑站」，從 2 號出口出來即可由西一門直接入園，既綠色出行又完全不用擔心景區停車位不足的問題。\n• 注意事項： 園區內全面禁止攜帶寵物，且除嬰兒車及輪椅外，平衡車、腳踏車、滑板車等個人代步工具皆不可入園。",

    // Safe LocalStorage Wrapper (Prevents frame crash if restricted)
 function getStoredSpots() {
  let list = defaultSpots;
  try {
    const stored = localStorage.getItem('tw_travel_spots');
    if (stored) list = JSON.parse(stored);
  } catch (e) {
    list = defaultSpots;
  }

  return list.sort((a, b) => (a.order || 999) - (b.order || 999));
}

    function setStoredSpots(data) {
      try {
        localStorage.setItem('tw_travel_spots', JSON.stringify(data));
      } catch (e) {
        console.warn('LocalStorage unavailable, maintaining state in memory.');
      }
    }

    // App Global State
    let spots = getStoredSpots();
    let currentSpotIndex = 0;
    let map = null;
    let currentTileLayer = null;
    let markers = [];
    let polyline = null;
    let isDrawerOpen = false;
    let isCanvasMode = false;

    window.onload = function() {
      initLeafletMap();
      renderSpotsList();
      renderMapFeatures();
      lucide.createIcons();

      // Multi-phase container resize calibration to fix blank map glitch
      window.addEventListener('resize', handleResize);
      setTimeout(handleResize, 100);
      setTimeout(handleResize, 300);
      setTimeout(handleResize, 800);
    };

    function handleResize() {
      if (map && !isCanvasMode) {
        map.invalidateSize();
      }
      if (isCanvasMode) {
        renderCanvasMap();
      }
    }

    function initLeafletMap() {
      try {
        map = L.map('map', {
          zoomControl: false,
          fadeAnimation: true
        }).setView([23.8, 121.0], 8);

        L.control.zoom({ position: 'bottomright' }).addTo(map);

        loadTileLayer('osm');

        map.on('click', function(e) {
          document.getElementById('form-lat').value = e.latlng.lat.toFixed(5);
          document.getElementById('form-lng').value = e.latlng.lng.toFixed(5);
          if (isDrawerOpen) switchTab('add');
        });
      } catch (err) {
        switchToCanvasMode();
      }
    }

    function loadTileLayer(providerKey) {
      if (isCanvasMode) {
        document.getElementById('canvas-map-container').classList.add('hidden');
        document.getElementById('map').classList.remove('hidden');
        isCanvasMode = false;
      }

      if (currentTileLayer && map) map.removeLayer(currentTileLayer);

      let url = 'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png';
      let attr = '&copy; OpenStreetMap';

      if (providerKey === 'carto-light') {
        url = 'https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png';
        attr = '&copy; CARTO';
      }

      currentTileLayer = L.tileLayer(url, { attribution: attr, maxZoom: 19, crossOrigin: true });
      currentTileLayer.on('tileerror', function() {
        if (providerKey === 'osm') changeTileProvider('carto-light');
        else switchToCanvasMode();
      });

      currentTileLayer.addTo(map);
      map.invalidateSize();
    }

    function changeTileProvider(key) {
      if (key === 'canvas') switchToCanvasMode();
      else loadTileLayer(key);
    }

    function switchToCanvasMode() {
      isCanvasMode = true;
      document.getElementById('map').classList.add('hidden');
      document.getElementById('canvas-map-container').classList.remove('hidden');
      document.getElementById('tile-provider-select').value = 'canvas';
      renderCanvasMap();
    }

    function renderCanvasMap() {
      if (!isCanvasMode || spots.length === 0) return;

      const svg = document.getElementById('canvas-svg');
      const container = document.getElementById('canvas-markers-layer');
      const width = svg.clientWidth || window.innerWidth;
      const height = svg.clientHeight || window.innerHeight;

      const lats = spots.map(s => s.lat), lngs = spots.map(s => s.lng);
      const minLat = Math.min(...lats), maxLat = Math.max(...lats);
      const minLng = Math.min(...lngs), maxLng = Math.max(...lngs);

      const pad = 90;
      const points = spots.map(s => {
        const x = pad + ((s.lng - minLng) / (maxLng - minLng || 1)) * (width - pad * 2);
        const y = height - (pad + ((s.lat - minLat) / (maxLat - minLat || 1)) * (height - pad * 2));
        return { ...s, x, y };
      });

      let pathD = points.map((p, i) => `${i === 0 ? 'M' : 'L'} ${p.x} ${p.y}`).join(' ');
      svg.innerHTML = `<path d="${pathD}" fill="none" stroke="#0284c7" stroke-width="4" stroke-dasharray="8,8" />`;

      container.innerHTML = points.map((p, index) => `
        <div style="position: absolute; left: ${p.x}px; top: ${p.y}px;" class="pointer-events-auto">
          <div class="marker-pin ${index === currentSpotIndex ? 'active' : ''}" onclick="openSpotModal(${index})">
            <span class="marker-pin-inner">${index + 1}</span>
          </div>
        </div>
      `).join('');
    }

    function renderMapFeatures() {
      if (isCanvasMode) {
        renderCanvasMap();
        return;
      }

      markers.forEach(m => map.removeLayer(m));
      markers = [];
      if (polyline) map.removeLayer(polyline);

      if (spots.length === 0) return;

      const latLngs = [];

      spots.forEach((spot, index) => {
        const latLng = [spot.lat, spot.lng];
        latLngs.push(latLng);

        const customIcon = L.divIcon({
          className: 'custom-pin-container',
          html: `
            <div class="marker-pin ${index === currentSpotIndex ? 'active' : ''}" id="pin-${spot.id}">
              <span class="marker-pin-inner">${index + 1}</span>
            </div>
          `,
          iconSize: [36, 36],
          iconAnchor: [18, 36]
        });

        const marker = L.marker(latLng, { icon: customIcon }).addTo(map);
        marker.on('click', () => openSpotModal(index));
        markers.push(marker);
      });

      if (latLngs.length > 1) {
        polyline = L.polyline(latLngs, {
          color: '#0284c7', weight: 4, opacity: 0.8, dashArray: '8, 8', lineCap: 'round'
        }).addTo(map);
      }

      fitMapBounds();
    }

    function fitMapBounds() {
      if (spots.length === 0) return;
      if (!isCanvasMode && map) {
        const bounds = L.latLngBounds(spots.map(s => [s.lat, s.lng]));
        map.fitBounds(bounds, { padding: [80, 80] });
      } else if (isCanvasMode) {
        renderCanvasMap();
      }
    }

    function renderSpotsList() {
      const container = document.getElementById('spots-container');
      document.getElementById('spot-count').innerText = spots.length;

      if (spots.length === 0) {
        container.innerHTML = `<div class="text-center py-10 text-slate-400 text-sm">目前無景點，點擊「新增/編輯景點」開始規劃。</div>`;
        return;
      }

      container.innerHTML = spots.map((spot, index) => `
        <div class="group relative bg-slate-50 hover:bg-brand-50/60 border border-slate-200/80 rounded-2xl p-3 transition-all flex items-center gap-3 cursor-pointer shadow-sm" onclick="openSpotModal(${index})">
          <div class="w-8 h-8 rounded-xl bg-brand-500 text-white font-bold flex items-center justify-center text-xs shrink-0 shadow-sm">
            ${index + 1}
          </div>
          <div class="w-14 h-14 rounded-xl overflow-hidden bg-slate-200 shrink-0 relative">
            <img src="${spot.image || 'https://placehold.co/200?text=No+Image'}" class="w-full h-full object-cover">
          </div>
          <div class="flex-1 min-w-0">
            <h4 class="font-bold text-slate-800 text-sm truncate">${spot.name}</h4>
            <p class="text-xs text-slate-500 line-clamp-1 mt-0.5">${spot.desc || '暫無介紹'}</p>
          </div>
          <div class="flex items-center gap-1 opacity-0 group-hover:opacity-100 transition-opacity" onclick="event.stopPropagation()">
            <button onclick="editSpot(${index})" class="p-1.5 text-slate-400 hover:text-brand-600 rounded-lg hover:bg-white" title="編輯"><i data-lucide="edit-3" class="w-4 h-4"></i></button>
            <button onclick="deleteSpot(${index})" class="p-1.5 text-slate-400 hover:text-rose-600 rounded-lg hover:bg-white" title="刪除"><i data-lucide="trash-2" class="w-4 h-4"></i></button>
          </div>
        </div>
      `).join('');

      lucide.createIcons();
    }

    function openSpotModal(index) {
      if (index < 0 || index >= spots.length) return;
      currentSpotIndex = index;
      const spot = spots[index];

      if (!isCanvasMode && map) {
        map.flyTo([spot.lat, spot.lng], 12, { duration: 1.2 });
      } else if (isCanvasMode) {
        renderCanvasMap();
      }

      document.querySelectorAll('.marker-pin').forEach(el => el.classList.remove('active'));
      const activePin = document.getElementById(`pin-${spot.id}`);
      if (activePin) activePin.classList.add('active');

      document.getElementById('modal-title').innerText = spot.name;
      document.getElementById('modal-latlng').innerText = `${spot.lat.toFixed(4)}, ${spot.lng.toFixed(4)}`;
      document.getElementById('modal-desc').innerText = spot.desc || '無詳細說明資訊。';
      document.getElementById('modal-badge').innerText = `SPOT ${String(index + 1).padStart(2, '0')}`;
      document.getElementById('modal-pagination').innerText = `${index + 1} / ${spots.length}`;

      document.getElementById('modal-img').src = spot.image || 'https://placehold.co/800x450?text=No+Image';

      const videoContainer = document.getElementById('modal-video-container');
      const mediaTabs = document.getElementById('media-tabs');

      if (spot.video) {
        mediaTabs.classList.remove('hidden');
        let embedHtml = '';
        if (spot.video.includes('youtube.com') || spot.video.includes('youtu.be')) {
          let ytUrl = spot.video.replace('watch?v=', 'embed/');
          embedHtml = `<iframe class="w-full h-full" src="${ytUrl}" frameborder="0" allowfullscreen></iframe>`;
        } else {
          embedHtml = `<video src="${spot.video}" controls class="w-full h-full object-contain"></video>`;
        }
        videoContainer.innerHTML = embedHtml;
      } else {
        mediaTabs.classList.add('hidden');
        videoContainer.innerHTML = '';
      }

      showMedia('photo');

      const modal = document.getElementById('spot-modal');
      const card = document.getElementById('modal-card');
      modal.classList.remove('opacity-0', 'pointer-events-none');
      card.classList.remove('scale-95');
      card.classList.add('scale-100');

      document.getElementById('btn-prev-spot').disabled = (index === 0);
      document.getElementById('btn-next-spot').disabled = (index === spots.length - 1);
    }

    function showMedia(type) {
      const imgEl = document.getElementById('modal-img');
      const videoContainer = document.getElementById('modal-video-container');
      const btnPhoto = document.getElementById('btn-media-photo');
      const btnVideo = document.getElementById('btn-media-video');

      if (type === 'video') {
        imgEl.classList.add('hidden');
        videoContainer.classList.remove('hidden');
        btnVideo.classList.add('bg-brand-600');
        btnPhoto.classList.remove('bg-brand-600');
      } else {
        imgEl.classList.remove('hidden');
        videoContainer.classList.add('hidden');
        btnPhoto.classList.add('bg-brand-600');
        btnVideo.classList.remove('bg-brand-600');
      }
    }

    function closeModal() {
      const modal = document.getElementById('spot-modal');
      const card = document.getElementById('modal-card');
      modal.classList.add('opacity-0', 'pointer-events-none');
      card.classList.remove('scale-100');
      card.classList.add('scale-95');
      document.getElementById('modal-video-container').innerHTML = '';
    }

    function navigateSpot(step) {
      const newIndex = currentSpotIndex + step;
      if (newIndex >= 0 && newIndex < spots.length) {
        openSpotModal(newIndex);
      }
    }

    function startPresentation() {
      if (spots.length === 0) return;
      openSpotModal(0);
    }

    function toggleDrawer() {
      const sidebar = document.getElementById('sidebar');
      isDrawerOpen = !isDrawerOpen;
      sidebar.classList.toggle('translate-x-full', !isDrawerOpen);
      setTimeout(handleResize, 300);
    }

    function switchTab(tab) {
      const listTab = document.getElementById('tab-list'), addTab = document.getElementById('tab-add');
      const listBtn = document.getElementById('tab-list-btn'), addBtn = document.getElementById('tab-add-btn');

      if (tab === 'add') {
        listTab.classList.add('hidden'); addTab.classList.remove('hidden');
        addBtn.classList.add('border-brand-500', 'text-brand-600', 'font-semibold');
        listBtn.classList.remove('border-brand-500', 'text-brand-600', 'font-semibold');
      } else {
        addTab.classList.add('hidden'); listTab.classList.remove('hidden');
        listBtn.classList.add('border-brand-500', 'text-brand-600', 'font-semibold');
        addBtn.classList.remove('border-brand-500', 'text-brand-600', 'font-semibold');
      }
    }

 function handleSaveSpot(event) {
  event.preventDefault();

  const spotId = document.getElementById('form-spot-id').value;
  const name = document.getElementById('form-name').value;
  const lat = parseFloat(document.getElementById('form-lat').value);
  const lng = parseFloat(document.getElementById('form-lng').value);
  const image = document.getElementById('form-image').value;
  const video = document.getElementById('form-video').value;
  const desc = document.getElementById('form-desc').value;
  
  
  const orderInput = document.getElementById('form-order');
  const order = orderInput && orderInput.value ? parseInt(orderInput.value, 10) : 999;

  if (spotId) {
    const idx = spots.findIndex(s => s.id === spotId);
  
    if (idx !== -1) spots[idx] = { ...spots[idx], name, lat, lng, image, video, desc, order };
  } else {
  
    spots.push({ id: "spot-" + Date.now(), name, lat, lng, image, video, desc, order });
  }

 
  spots.sort((a, b) => (a.order || 999) - (b.order || 999));

  setStoredSpots(spots);
  renderSpotsList();
  renderMapFeatures();
  resetForm();
  switchTab('list');
}

    function editSpot(index) {
      const spot = spots[index];
      document.getElementById('form-spot-id').value = spot.id;
      document.getElementById('form-name').value = spot.name;
document.getElementById('form-order').value = spot.order || '';
      document.getElementById('form-lat').value = spot.lat;
      document.getElementById('form-lng').value = spot.lng;
      document.getElementById('form-image').value = spot.image || '';
      document.getElementById('form-video').value = spot.video || '';
      document.getElementById('form-desc').value = spot.desc || '';
      switchTab('add');
    }

    function deleteSpot(index) {
      if (confirm(`確定要刪除「${spots[index].name}」嗎？`)) {
        spots.splice(index, 1);
        setStoredSpots(spots);
        renderSpotsList();
        renderMapFeatures();
      }
    }

    function resetForm() {
      document.getElementById('spot-form').reset();
      document.getElementById('form-spot-id').value = '';
    }

    function exportData() {
      const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(spots, null, 2));
      const a = document.createElement('a');
      a.setAttribute("href", dataStr);
      a.setAttribute("download", "taiwan_travel_itinerary.json");
      document.body.appendChild(a);
      a.click();
      a.remove();
    }
  </script>
